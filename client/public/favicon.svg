<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <!-- Dark Blue Rounded Container -->
  <rect width="180" height="180" rx="40" fill="#0f172a"/>
  
  <!-- Left Angle Bracket < (Electric Blue) -->
  <path d="M 45 60 L 20 90 L 45 120" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Letter S -->
  <text x="90" y="122" font-family="Arial, monospace, sans-serif" font-weight="900" font-size="95" fill="#ffffff" text-anchor="middle">S</text>
  
  <!-- Right Angle Bracket > (Electric Blue) -->
  <path d="M 135 60 L 160 90 L 135 120" stroke="#0284c7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
